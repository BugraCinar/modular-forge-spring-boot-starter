name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - name: Update from the public NVD cache
        if: env.NVD_API_KEY == ''
        run: ./mvnw -B -ntp -Psecurity-audit -DskipTests -DknownExploitedEnabled=false "-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" dependency-check:update-only
      - name: Audit with the NVD API
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B -ntp -Psecurity-audit -DskipTests -DnvdApiKeyEnvironmentVariable=NVD_API_KEY verify
      - name: Audit with cached NVD data
        if: env.NVD_API_KEY == ''
        run: ./mvnw -B -ntp -Psecurity-audit -DskipTests -DautoUpdate=false verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
