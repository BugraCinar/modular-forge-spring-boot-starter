name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -DskipTests package
      - name: Analyze and upload to GitHub Code Scanning
        if: github.event.repository.private == false
        uses: github/codeql-action/analyze@v4
      - name: Analyze without GitHub Code Security
        if: github.event.repository.private
        uses: github/codeql-action/analyze@v4
        with:
          output: ../results
          upload: never
          upload-database: false
      - name: Upload private-repository SARIF
        if: github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: ../results
          retention-days: 14
