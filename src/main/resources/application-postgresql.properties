spring.config.activate.on-profile=postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:modularforge}?sslmode=${DB_SSL_MODE:verify-full}}
spring.datasource.username=${DB_USER:modularforge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
