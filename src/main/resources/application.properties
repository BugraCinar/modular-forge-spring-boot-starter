spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
spring.application.name=${APP_NAME:ModularForge}
server.port=${SERVER_PORT:8080}
app.api.url=${API_URL:http://localhost:8080}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# keep framework error responses quiet; the API exception handler owns details
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# module switches are also reported by GET /api/v1/modules
app.modules.admin-management.enabled=${MODULE_ADMIN_MANAGEMENT_ENABLED:true}
app.modules.user-profile.enabled=${MODULE_USER_PROFILE_ENABLED:true}
app.modules.two-factor.enabled=${MODULE_TWO_FACTOR_ENABLED:false}
app.modules.image-storage.enabled=${MODULE_IMAGE_STORAGE_ENABLED:false}
app.modules.audit.enabled=${MODULE_AUDIT_ENABLED:true}
app.modules.notification-email.enabled=${MODULE_EMAIL_ENABLED:true}
app.modules.database-backup.enabled=${MODULE_DATABASE_BACKUP_ENABLED:false}
app.modules.observability.enabled=${MODULE_OBSERVABILITY_ENABLED:false}

# database behavior shared by every JDBC provider
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_ACTIVE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}

# these secrets have no usable default and startup validation rejects weak values
app.security.pepper=${PEPPER:}
app.security.token-hash-secret=${TOKEN_HASH_SECRET:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.jwt.issuer=${JWT_ISSUER:modular-forge}
app.security.argon2.memory-cost=${ARGON2_MEMORY_COST:65536}
app.security.argon2.time-cost=${ARGON2_TIME_COST:3}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:4}
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:32}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:64}

# browser refresh tokens are HttpOnly; cookie-authenticated refresh/logout also use CSRF protection
app.refresh-token.cookie-name=${REFRESH_COOKIE_NAME:refreshToken}
app.refresh-token.cookie-max-age=${REFRESH_COOKIE_MAX_AGE:2592000}
app.refresh-token.cookie-path=/api/v1/auth
app.refresh-token.use-cookies=${REFRESH_USE_COOKIES:true}
app.refresh-token.cookie-secure=${COOKIE_SECURE:true}

# Redis is authoritative in deployed environments. Development can opt into fail-open mode.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
app.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:false}
app.rate-limit.global.requests=${RATE_LIMIT_GLOBAL_REQUESTS:30}
app.rate-limit.global.window=${RATE_LIMIT_GLOBAL_WINDOW:60000}
app.rate-limit.login.attempts=${RATE_LIMIT_LOGIN_ATTEMPTS:5}
app.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:900000}
app.rate-limit.api.calls=${RATE_LIMIT_API_CALLS:100}
app.rate-limit.api.window=${RATE_LIMIT_API_WINDOW:60000}
app.rate-limit.chat.requests=${RATE_LIMIT_CHAT_REQUESTS:20}
app.rate-limit.chat.window=${RATE_LIMIT_CHAT_WINDOW:60000}
app.rate-limit.email-verification.attempts=${RATE_LIMIT_EMAIL_VERIFICATION_ATTEMPTS:3}
app.rate-limit.email-verification.window=${RATE_LIMIT_EMAIL_VERIFICATION_WINDOW:3600000}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-XSRF-TOKEN}

# SMTP is replaceable, but the default auth workflows expect an email provider
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
app.email.sender=${MAIL_SENDER:no-reply@example.com}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# optional Cloudflare R2 adapter
app.modules.image-storage.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
app.modules.image-storage.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
app.modules.image-storage.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
app.modules.image-storage.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
app.modules.image-storage.r2.public-domain=${CLOUDFLARE_R2_PUBLIC_DOMAIN:}

# optional TOTP adapter; value must be base64 for exactly 32 random bytes
app.modules.two-factor.encryption-key=${TWO_FACTOR_ENCRYPTION_KEY:}
app.modules.two-factor.challenge-ttl-seconds=${TWO_FACTOR_CHALLENGE_TTL_SECONDS:300}

recaptcha.enabled=${RECAPTCHA_ENABLED:false}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.score-threshold=${RECAPTCHA_SCORE_THRESHOLD:0.5}
recaptcha.expected-hostname=${RECAPTCHA_EXPECTED_HOSTNAME:}
recaptcha.expected-action=${RECAPTCHA_EXPECTED_ACTION:login}

app.security.log-auth-errors=${app.modules.audit.enabled}
app.security.log-sensitive-access=${app.modules.audit.enabled}
app.security.sensitive-access-email-alert=${SENSITIVE_ACCESS_EMAIL_ALERT:false}
app.activity-log.retention-days=${ACTIVITY_LOG_RETENTION_DAYS:30}
app.account.deactivation.grace-period-days=${ACCOUNT_DEACTIVATION_GRACE_PERIOD_DAYS:30}

app.database.backup.enabled=${app.modules.database-backup.enabled}
app.database.backup.recipient-email=${DATABASE_BACKUP_EMAIL:}
app.database.backup.directory=${DATABASE_BACKUP_DIRECTORY:backups}
app.database.backup.mysqldump-path=${MYSQLDUMP_PATH:mysqldump}
app.data.init-users=${INIT_USERS:false}
app.data.admin-username=${SEED_ADMIN_USERNAME:local_admin}
app.data.admin-email=${SEED_ADMIN_EMAIL:admin@example.com}
app.data.admin-password=${SEED_ADMIN_PASSWORD:}
app.data.user-username=${SEED_USER_USERNAME:local_user}
app.data.user-email=${SEED_USER_EMAIL:user@example.com}
app.data.user-password=${SEED_USER_PASSWORD:}

app.swagger.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${app.swagger.enabled}
springdoc.swagger-ui.enabled=${app.swagger.enabled}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:1.0.0}
info.app.description=Modular Spring Boot REST API

sentry.dsn=${SENTRY_DSN:}
sentry.enabled=${app.modules.observability.enabled}
sentry.send-default-pii=false
sentry.logs.enabled=${SENTRY_LOGS_ENABLED:true}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.05}
sentry.profile-session-sample-rate=${SENTRY_PROFILE_SESSION_SAMPLE_RATE:0.01}
sentry.profile-lifecycle=${SENTRY_PROFILE_LIFECYCLE:TRACE}
