spring.config.activate.on-profile=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:modulithforge}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
