spring.config.activate.on-profile=mariadb
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:modulithforge}?sslMode=${DB_SSL_MODE:verify-full}}
spring.datasource.username=${DB_USER:modulithforge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
